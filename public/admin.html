<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель · База знаний</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --ink:#18212C; --ink-soft:#5A6675;
  --line:#D9DFE6; --accent:#1F4FD8; --accent-soft:#E8EEFF; --danger:#C0392B;
  --mono:'JetBrains Mono',monospace; --sans:'Golos Text',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:32px 24px}
.wrap{max-width:960px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
h1{font-size:20px;font-weight:600}
header a{color:var(--accent);text-decoration:none;font-size:14px}
.stats{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:150px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;margin-top:2px}
.stat span{font-size:12px;color:var(--ink-soft)}
h2{font-size:14px;font-weight:600;margin:28px 0 12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);background:#F7F9FB}
tr:last-child td{border-bottom:none}
td.mono{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.del{background:none;border:1px solid var(--line);color:var(--danger);border-radius:6px;
  padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.del:hover{border-color:var(--danger)}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px}
.form-row{display:grid;grid-template-columns:1fr 220px;gap:12px}
input,textarea,select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:160px;resize:vertical;font-family:var(--mono);font-size:13px}
.submit{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;justify-self:start;padding-inline:24px}
.note{font-size:12px;color:var(--ink-soft)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{padding:12px 16px;cursor:pointer;font-size:13.5px;display:flex;gap:12px;align-items:baseline}
summary .q{font-weight:500;flex:1}
summary .t{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
details .body{padding:0 16px 14px;font-size:13px;line-height:1.55;white-space:pre-wrap;color:var(--ink-soft)}
details .body b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>База знаний и журнал обращений</h1>
    <a href="/">← к чату</a>
  </header>

  <div class="stats" id="stats"></div>

  <h2>Добавить документ</h2>
  <form id="add-form">
    <div class="form-row">
      <input id="f-title" placeholder="Заголовок инструкции, напр. «Настройка VPN»" required>
      <input id="f-category" placeholder="Раздел, напр. «Сеть»" value="Общее">
    </div>
    <textarea id="f-content" placeholder="Текст инструкции. Абзацы разделяйте пустой строкой — по ним идёт разбивка на фрагменты (чанки)." required></textarea>
    <div class="note">Документ автоматически разбивается на фрагменты ~900 символов для поиска.</div>
    <button class="submit">Добавить в базу</button>
  </form>

  <h2>Документы</h2>
  <table>
    <thead><tr><th>Заголовок</th><th>Раздел</th><th>Фрагментов</th><th>Размер</th><th></th></tr></thead>
    <tbody id="doc-rows"></tbody>
  </table>

  <h2>Журнал обращений (последние)</h2>
  <div id="log-list"></div>
</div>

<script>
async function load() {
  const [docs, logs, stats] = await Promise.all([
    fetch('/api/documents').then(r => r.json()),
    fetch('/api/logs').then(r => r.json()),
    fetch('/api/stats').then(r => r.json())
  ]);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><span>Документов</span><b>${docs.length}</b></div>
    <div class="stat"><span>Обращений всего</span><b>${stats.total || 0}</b></div>
    <div class="stat"><span>Среднее время ответа</span><b>${stats.avg_latency ? (stats.avg_latency/1000).toFixed(1)+' c' : '—'}</b></div>
    <div class="stat"><span>Максимум</span><b>${stats.max_latency ? (stats.max_latency/1000).toFixed(1)+' c' : '—'}</b></div>`;

  document.getElementById('doc-rows').innerHTML = docs.map(d => `
    <tr>
      <td>${esc(d.title)}</td>
      <td>${esc(d.category)}</td>
      <td class="mono">${d.chunk_count}</td>
      <td class="mono">${(d.size/1024).toFixed(1)} КБ</td>
      <td><button class="del" onclick="delDoc(${d.id})">Удалить</button></td>
    </tr>`).join('') || '<tr><td colspan="5">База пуста — добавьте первую инструкцию или выполните npm run seed</td></tr>';

  document.getElementById('log-list').innerHTML = logs.map(l => {
    const src = JSON.parse(l.sources || '[]').map(s => s.title).join(', ') || '—';
    return `<details>
      <summary><span class="q">${esc(l.question)}</span>
        <span class="t">${l.ts} · ${l.latency_ms ? (l.latency_ms/1000).toFixed(1)+' c' : '—'}</span></summary>
      <div class="body"><b>Источники:</b> ${esc(src)}\n\n${esc(l.answer || '')}</div>
    </details>`;
  }).join('') || '<div class="note">Обращений пока нет.</div>';
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function delDoc(id) {
  if (!confirm('Удалить документ из базы знаний?')) return;
  await fetch('/api/documents/' + id, { method: 'DELETE' });
  load();
}

document.getElementById('add-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    title: document.getElementById('f-title').value,
    category: document.getElementById('f-category').value || 'Общее',
    content: document.getElementById('f-content').value
  };
  const res = await fetch('/api/documents', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (res.ok) { e.target.reset(); load(); }
  else alert('Ошибка при добавлении документа');
});

load();
</script>
</body>
</html>
